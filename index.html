<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foot Locker Grab</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importation d'une police similaire pour le titre (style dripping/horror) et le texte -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">FOOT LOCKER GRAB</h1>
            <p class="subtitle">Jouez et gagnez les sneakers<br>de vos rêves.</p>
        </div>

        <div class="visual-elements">
            <!-- Machine à pince (Claw) -->
            <div class="claw-container">
                <img src="Capture d'écran 2026-01-11 171634.png" alt="Claw Machine" class="claw-icon">
            </div>
            
            <!-- Groupe de sneakers -->
            <div class="sneakers-group">
                <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=400&auto=format&fit=crop" alt="Sneaker 1" class="sneaker sneaker-1">
                <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=400&auto=format&fit=crop" alt="Sneaker 2" class="sneaker sneaker-2">
                <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=400&auto=format&fit=crop" alt="Sneaker 3" class="sneaker sneaker-3">
            </div>
        </div>

        <div class="footer">
            <a href="#" class="btn-play">jouer</a>
        </div>
    </div>
</body>
</html>
